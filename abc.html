<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonConnect - Login/SignUp</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .left-section {
            flex: 1;
            background-image: url('https://petapixel.com/assets/uploads/2021/06/Social-Medias-Impact-on-Landscape-and-Nature-Photography.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .left-section h1 {
            font-size: 2.5em;
            margin: 0;
        }
        .left-section p {
            font-size: 1.5em;
            margin-top: 10px;
        }
        .right-section {
            width: 400px;
            background-color: #E7F1F2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: -5px 0px 15px rgba(0, 0, 0, 0.1);
        }
        .form-toggle {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 20px;
        }
        .form-toggle button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: rgba(69, 129, 130, 0.8);
            color: white;
            border: none;
            border-radius: 5px;
        }
        .form-toggle button.active {
            background-color: rgba(69, 129, 130, 1);
        }
        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .form-group button {
            background-color: #458182;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body><header class="navbar">
    <img src="images/CarbonConnect-removebg-preview.png" alt="Logo">
    <nav>
        <li><a href="index.html">Home</a></li>
        <li><a href="project.html">Curated Projects</a></li>
        <li><a href="bid1.html">Bid&Buy</a></li>
        <li><a href="quiz.html">Footprint Calculator</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      
        
    </nav>
    <li><a href="abc.html" class="profile-icon">Login/Sign Up</a></li>
</header>

    <div class="left-section">
        <h1>CarbonConnect</h1>
        <p>Simplify, Connect & Offset</p>
    </div>

    <div class="right-section">
        <div class="form-toggle">
            <button id="clientButton" class="active">Client</button>
            <button id="projectOwnerButton">Project Owner</button>
        </div>
        <div class="form-container">
            <form id="loginForm">
                <h2>Login as <span id="userType">Client</span></h2>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <button type="button" onclick="loginUser()">Login</button>
                </div>
            </form>

            <form id="signupForm" style="display: none;">
                <h2>Sign Up as <span id="userTypeSignup">Client</span></h2>
                <div class="form-group">
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signupPassword" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <button type="button" onclick="registerUser()">Sign Up</button>
                </div>
            </form>
        </div>
        <button id="toggleLoginSignup">Switch to Sign Up</button>
    </div>

    <script>
        // Toggle between Client and Project Owner
        document.getElementById("clientButton").addEventListener("click", () => toggleUserType("Client"));
        document.getElementById("projectOwnerButton").addEventListener("click", () => toggleUserType("Project Owner"));

        function toggleUserType(userType) {
            document.getElementById("userType").innerText = userType;
            document.getElementById("userTypeSignup").innerText = userType;

            document.getElementById("clientButton").classList.toggle("active", userType === "Client");
            document.getElementById("projectOwnerButton").classList.toggle("active", userType === "Project Owner");
        }

        // Toggle between Login and Sign Up forms
        document.getElementById("toggleLoginSignup").addEventListener("click", toggleForm);

        function toggleForm() {
            const loginForm = document.getElementById("loginForm");
            const signupForm = document.getElementById("signupForm");
            const isLogin = loginForm.style.display !== "none";

            loginForm.style.display = isLogin ? "none" : "block";
            signupForm.style.display = isLogin ? "block" : "none";
            document.getElementById("toggleLoginSignup").innerText = isLogin ? "Switch to Login" : "Switch to Sign Up";
        }

        // Register new user and save to local storage
        function registerUser() {
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const name = document.getElementById("fullName").value;

    // Check if a user with the same email is already registered
    const storedUserInfo = JSON.parse(localStorage.getItem("userInfo"));
    if (storedUserInfo && storedUserInfo.email === email) {
        alert("User already registered with this email. Please use a different email or log in.");
        return; // Exit the function if the email already exists
    }

    // Save new user info in local storage if email is unique
    const userInfo = { email, password, name };
    localStorage.setItem("userInfo", JSON.stringify(userInfo));
    alert("Registration successful!");

    // Clear form fields
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";
    document.getElementById("fullName").value = "";
}

        // Validate login credentials against stored data
        function loginUser() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const storedUserInfo = JSON.parse(localStorage.getItem("userInfo"));

            if (storedUserInfo && storedUserInfo.email === email && storedUserInfo.password === password) {
                alert("Login successful!");

                // Clear form fields
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
            } else {
                alert("Incorrect email or password.");
            }
        }
    </script>

</body>
</html>
